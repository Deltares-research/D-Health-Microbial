[default]
# ISO 3166-1 alpha-3 country code for Suriname (SUR) and related prefixes
# used throughout tests and data filenames
extend-ignore-words-re = [
    "(?i)\\bSUR\\b",
    "(?i)\\bsur_",
    # WorldPop hub alias for the Global_2000_2020_Constrained series
    # (`ascic_2020`), documented in config/preprocessing.py. Not "ascii".
    "(?i)\\bascic\\b",
    "(?i)\\bascic_",
    # `np.arange`. typos "corrects" this to `arrange`, which is not a numpy
    # function — commit 3880666 silently broke a notebook and a docs snippet
    # that way. Without this, the hook re-breaks them on every commit.
    "\\barange\\b",
]
