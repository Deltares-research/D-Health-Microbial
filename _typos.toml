[default]
# ISO 3166-1 alpha-3 country code for Suriname (SUR) and related prefixes
# used throughout tests and data filenames
extend-ignore-words-re = [
    "(?i)\\bSUR\\b",
    "(?i)\\bsur_",
    # WorldPop hub alias for the Global_2000_2020_Constrained series
    # (`ascic_2020`), documented in config/preprocessing.py. Not "ascii".
    "(?i)\\bascic\\b",
    "(?i)\\bascic_",
    # `np.arange`. typos "corrects" this to `arrange`, which is not a numpy
    # function — commit 3880666 silently broke a notebook and a docs snippet
    # that way. Without this, the hook re-breaks them on every commit.
    "\\barange\\b",
]

# `PNGs`. typos splits the plural into `PN` + `Gs` and "corrects" the leading
# `PN` to `ON`, yielding "ONGs" — it had already done so in docs/API_REFERENCE.md
# before anyone noticed. Singular `PNG` is unaffected; only the plural trips it.
# Same failure mode as `arange` above.
#
# This has to be an *identifier* exclusion, not an `extend-ignore-words-re`
# entry: the word typos reports is `PN`, not `PNGs`, so a word-level pattern
# never matches — and ignoring `PN` outright would be far too broad.
[default.extend-identifiers]
PNGs = "PNGs"
