[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d_health"
description = "Floods and Health Tool: E. coli emissions, exposure, and risk modelling."
readme = "README.md"
# Only 3.12 is exercised (pixi pins it, CI runs it). Widen once CI actually
# tests another version, rather than advertising support nobody has verified.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Panos Athanasiou" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]
# Runtime imports only. The native geospatial stack (GDAL and friends) is
# supplied by conda-forge via [tool.pixi.dependencies] — see the note there on
# why `gdal` must not be listed here.
dependencies = [
    "numpy",
    "rasterio",
    "xarray",
    "rioxarray",
    "netcdf4",
    "pandas",
    "requests",
    "matplotlib",
    "utm",
    "wbgapi",
    "pydantic>=2.6",
    "tomli_w",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Deltares-research/D-Health-Microbial"
Issues = "https://github.com/Deltares-research/D-Health-Microbial/issues"

[project.optional-dependencies]
notebook = [
    "jupyter",
    "ipykernel",
]
test = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
d-health = "d_health.cli:main"

### setuptools ###
[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic.version]
attr = "d_health.__version__"

[tool.setuptools.packages.find]
include = ["d_health", "d_health.*"]

# PEP 561: without this marker the package is fully annotated and every type
# checker downstream ignores all of it.
[tool.setuptools.package-data]
d_health = ["py.typed"]

### tooling ###
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=d_health --cov-report=term-missing"

[tool.coverage.report]
# Set below the measured baseline (69%) so it cannot fail on day one, then
# ratchet up as the preprocessing and plotting gaps close. A floor that starts
# below reality is a floor people keep.
fail_under = 65
show_missing = true

[tool.ruff]
target-version = "py312"
# Notebooks are example prose-with-code, not library code, and are linted to a
# different standard (long lines, top-level imports mid-file). The pre-commit
# ruff hook already excluded them; keep the `pixi run ruff` task consistent with
# it rather than having the two disagree about what "clean" means.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Ruff with no config runs only E4/E7/E9/F — syntax errors and undefined names,
# i.e. almost nothing. These are the rule sets that actually pay here:
#   I    import sorting (already drifting in tests/conftest.py)
#   B    bugbear — catches the mutable-default-argument shape used for `cfg=`
#   NPY  numpy-specific lints, directly relevant to the numeric core
#   UP   pyupgrade
select = ["E", "F", "I", "B", "NPY", "UP", "W"]
# Line length is black's job, and it cannot split a long string or comment —
# enforcing E501 on top of a formatter just creates noise the formatter can't fix.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The preprocessing entry points take `cfg: WorldPopConfig = WorldPopConfig()`.
# B008 flags that shape because a mutable default would be shared across calls —
# but these configs are frozen pydantic models, so the instance cannot be
# mutated and sharing it is safe and intentional.
"d_health/preprocessing/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# The package is thoroughly annotated, so this finds real things immediately.
# Start permissive on third-party stubs (rasterio/rioxarray/wbgapi ship none)
# and tighten over time rather than boiling the ocean now.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

### pixi ###
[tool.pixi.workspace]
name = "d_health"
channels = ["conda-forge"]
platforms = ["win-64"]

# The native stack comes from conda-forge. `gdal` in particular is here and NOT
# in [project.dependencies]: it is not reliably installable from PyPI (it needs a
# matching system GDAL and a compiler), so listing it as a PyPI dependency makes
# `pip install d_health` fail at resolve time for anyone not using pixi. Nothing
# in the package imports `osgeo` directly — rasterio bundles what we need — so it
# is a environment-level dependency, not a project one.
[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
gdal = "*"
rasterio = "*"
pandas = "*"
tomli-w = ">=1.2.0,<2"
xarray = ">=2026.4.0,<2027"
rioxarray = ">=0.22.0,<0.23"
netcdf4 = ">=1.7.4,<2"
libgdal-netcdf = ">=3.12.3,<4"

[tool.pixi.tasks]
tests = { cmd = "pytest", default-environment = "test" }
ruff = { cmd = "ruff check .", default-environment = "lint" }
black = { cmd = "black --check .", default-environment = "lint" }
typos = { cmd = "typos .", default-environment = "lint" }
mypy = { cmd = "mypy d_health", default-environment = "lint" }
precommit = { cmd = "pre-commit run --all-files --show-diff-on-failure", default-environment = "lint" }

[tool.pixi.feature.editable.pypi-dependencies]
d_health = { path = ".", editable = true }

[tool.pixi.feature.test.pypi-dependencies]
d_health = { path = ".", editable = true, extras = ["test"] }

[tool.pixi.feature.lint.pypi-dependencies]
ruff = "*"
black = "*"
typos = "*"
pre-commit = "*"
mypy = "*"

[tool.pixi.environments]
default = { features = ["notebook", "editable", "lint"] }
test = { features = ["test"] }
lint = { features = ["lint"] }
