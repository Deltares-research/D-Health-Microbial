[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d_health"
description = "Floods and Health Tool: E. coli emissions, exposure, and risk modelling."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "rasterio",
    "xarray",
    "rioxarray",
    "netcdf4",
    "pyyaml",
    "dask",
    "requests",
    "gdal",
    "openturns",
    "matplotlib",
    "utm",
    "salib",
    "seaborn",
    "wbgapi",
    "pyproj",
    "pydantic>=2.6",
    "tomli_w",
]
dynamic = ["version"]

[project.optional-dependencies]
notebook = [
    "jupyter",
    "ipykernel",
]
test = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
d-health = "d_health.cli:main"

### setuptools ###
[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic.version]
attr = "d_health.__version__"

[tool.setuptools.packages.find]
include = ["d_health", "d_health.*"]

### pixi ###
[tool.pixi.workspace]
name = "d_health"
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
gdal = "*"
rasterio = "*"
openturns = "*"
tomli-w = ">=1.2.0,<2"
xarray = ">=2026.4.0,<2027"
rioxarray = ">=0.22.0,<0.23"
netcdf4 = ">=1.7.4,<2"
pre-commit = "*"

[tool.pixi.feature.editable.pypi-dependencies]
d_health = { path = ".", editable = true }

[tool.pixi.feature.test.pypi-dependencies]
d_health = { path = ".", editable = true, extras = ["test"] }

[tool.pixi.environments]
default = { features = ["notebook", "editable"] }
test = { features = ["test"] }
